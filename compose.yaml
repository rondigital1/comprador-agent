services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: comprador
      POSTGRES_PASSWORD: comprador
      POSTGRES_USER: comprador
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comprador -d comprador"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "55432:5432"
    volumes:
      - comprador-postgres:/var/lib/postgresql/data

volumes:
  comprador-postgres:
